<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    try {
      const theme = localStorage.getItem('smartschool-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.classList.add('dark');
    } catch (_) {}
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  
  <title>SmartSchool OS | Next-Gen AI School Management</title>
  <meta name="description" content="Empowering educational institutions with AI-driven insights, real-time fleet tracking, and automated academic management. The future of school ERP is here." />
  
  <!-- SEO & Social Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SmartSchool OS - AI Powered Education" />
  <meta property="og:description" content="Experience the most advanced school management ecosystem with real-time tracking and AI analytics." />
  <!-- TODO: replace with real og-image.png once marketing assets are ready. -->
  <meta property="og:image" content="/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- SRI not used: Google Fonts CSS is dynamic. Risk accepted. -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      background: #0f172a;
    }
    #root {
      min-height: 100vh;
    }
    /* Simple preloader style */
    .preloader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    .loader-spin {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(99, 102, 241, 0.1);
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body class="selection:bg-indigo-500 selection:text-white">
  <div id="root">
    <div class="preloader" id="preloader">
      <div class="loader-spin"></div>
      <p style="color: #6366f1; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; margin-top: 20px;">Orchestrating SmartSchool OS</p>
    </div>
  </div>
  <script type="module" src="/frontend/index.tsx"></script>
  <script>
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        preloader.style.opacity = '0';
        setTimeout(() => preloader.remove(), 500);
      }
    });
  </script>
</body>

</html>
